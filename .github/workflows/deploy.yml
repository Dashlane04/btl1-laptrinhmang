name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # Unit test luật chơi + mô hình state: chạy thuần Node, không cần cài gì.
      - name: Unit test
        run: npm run test:unit

